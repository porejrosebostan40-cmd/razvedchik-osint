name: CI

on:
  push:
    branches: [main, test/exa-vs-search]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install . pytest
      - run: pytest -q

  exa-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pip && pip install .
      - name: Run Exa comparison
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: python3 scripts/exa_vs_search_test.py

  exa-event-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pip && pip install .
      - name: Run Exa event gate
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: python3 scripts/exa_event_gate_test.py
