name: Firecrawl scrape benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - bench/firecrawl-scrape

# Triggered automatically on this isolated benchmark branch.
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python scripts/firecrawl_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: firecrawl-benchmark
          path: firecrawl_benchmark_report.json
