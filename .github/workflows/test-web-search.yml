name: Test web_search tool

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-web-search.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secret presence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is empty"
            exit 1
          fi
          echo "OPENAI_API_KEY present"

      - name: Validate TinyFish configuration
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          if [ -z "$TINYFISH_API_KEY" ]; then
            echo "TINYFISH_API_KEY is empty"
            exit 1
          fi
          echo "TINYFISH_API_KEY present"

      - name: Test web_search via curl
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          echo "=== Request ==="
          curl -sS -w "\nHTTP_STATUS=%{http_code}\n" \
            https://api.openai.com/v1/responses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d '{
              "model": "gpt-5.6-luna",
              "input": "What is one news headline from today?",
              "tools": [{"type": "web_search"}],
              "max_output_tokens": 300
            }' | tee /tmp/web_search_response.txt

          echo ""
          echo "=== Parsed response ==="
          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = Path('/tmp/web_search_response.txt').read_text(encoding='utf-8')
          body = raw.split('HTTP_STATUS=')[0].strip()

          try:
              data = json.loads(body)
          except Exception as exc:
              print(f"PARSE_ERROR: {type(exc).__name__}: {exc}")
              print("RAW_BODY_PREVIEW:")
              print(body[:1500])
              raise SystemExit(0)

          print(f"model={data.get('model')}")
          print(f"status={data.get('status')}")
          print(f"id={data.get('id')}")

          if 'error' in data:
              print(f"ERROR={json.dumps(data['error'], ensure_ascii=False)}")

          output = data.get('output') or []
          print(f"output_items={len(output)}")
          for i, item in enumerate(output):
              item_type = item.get('type') if isinstance(item, dict) else type(item).__name__
              print(f"  [{i}] type={item_type}")

          types = [item.get('type') for item in output if isinstance(item, dict)]
          if 'web_search_call' in types:
              print("RESULT: WEB_SEARCH_AVAILABLE")
          elif 'message' in types:
              print("RESULT: MESSAGE_ONLY_NO_WEB_SEARCH")
          else:
              print(f"RESULT: UNEXPECTED_TYPES={types}")
          PY
