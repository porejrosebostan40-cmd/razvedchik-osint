name: Test Bing regional query (isolated)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: pip install -e .

      - name: Run isolated Bing regional test
        run: python scripts/test_bing_regional.py

      - name: Upload regional test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-bing-regional-result
          path: |
            /tmp/test_bing_regional_result.json
            /tmp/test_bing_regional_*.html
          if-no-files-found: ignore
