name: Test web_search analyze

on:
  workflow_dispatch:
  push:
    paths:
      - "src/riskwatch/ai.py"
      - "scripts/test_web_search_analyze.py"
      - ".github/workflows/test-web-search-analyze.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run one-region analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          python3 -m pip install -e .
          python3 scripts/test_web_search_analyze.py
