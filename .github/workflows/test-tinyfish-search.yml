name: Test TinyFish Search

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/smoke_tinyfish.py"
      - ".github/workflows/test-tinyfish-search.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run TinyFish Search smoke test
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: python scripts/smoke_tinyfish.py
