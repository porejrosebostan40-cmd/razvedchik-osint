name: Разведчик

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Search mode"
        required: true
        default: "fio"
        type: choice
        options: [fio, username, nickname, phone, email, combined]
      query:
        description: "Search seed"
        required: true
        type: string
      waves:
        description: "Autonomous search waves"
        required: true
        default: "4"
        type: string
      per_query:
        description: "Results per search query"
        required: true
        default: "8"
        type: string

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install .
      - name: Run investigation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python -m razvedchik --mode "${{ inputs.mode }}" --query "${{ inputs.query }}" --waves "${{ inputs.waves }}" --per-query "${{ inputs.per_query }}"
      - name: Publish dossier
        uses: actions/upload-artifact@v4
        with:
          name: razvedchik-dossier
          path: reports/
          if-no-files-found: warn
