name: RiskWatch tests
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install . pytest
      - run: pytest -q tests/test_riskwatch.py
      - name: Verify exact OpenAI analysis path
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          python - <<'PY'
          from riskwatch.ai import analyze
          result=analyze([{"url":"https://example.org/test","title":"Test signal","snippet":"Test signal for RiskWatch AI integration","region":"","kind":"smoke","source":"smoke"}])
          print(result)
          assert result.get("analysis_provider") == "openai", result
          assert all(0 <= int(result[k]) <= 100 for k in ("probability","confidence","risk"))
          PY
