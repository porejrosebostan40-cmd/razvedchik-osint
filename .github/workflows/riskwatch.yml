name: RiskWatch
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '7,27,47 * * * *'
concurrency:
  group: riskwatch-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  monitor:
    if: github.event_name != 'push' || github.actor != 'riskwatch-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip && pip install .
      - name: Validate OpenAI secret presence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"
      - name: Run RiskWatch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISKWATCH_STATE: riskwatch_state.json
          MAX_RESULTS_PER_QUERY: '6'
        run: python -m riskwatch.cli > riskwatch_latest.json
      - name: Persist state safely
        shell: bash
        run: |
          set -euo pipefail
          cp riskwatch_state.json /tmp/riskwatch_state.local.json
          cp riskwatch_latest.json /tmp/riskwatch_latest.local.json
          git config user.name 'riskwatch-bot'
          git config user.email 'riskwatch-bot@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path
          def compact_event(e):
              keep=('url','title','snippet','source','query','region','kind','ts','published_ts','published','date')
              out={k:e[k] for k in keep if k in e}
              if isinstance(out.get('snippet'),str): out['snippet']=out['snippet'][:700]
              if isinstance(out.get('title'),str): out['title']=out['title'][:500]
              return out
          remote=json.loads(Path('riskwatch_state.json').read_text(encoding='utf-8'))
          local=json.loads(Path('/tmp/riskwatch_state.local.json').read_text(encoding='utf-8'))
          events={**remote.get('events',{}), **local.get('events',{})}
          events=dict(sorted(events.items(), key=lambda kv: kv[1].get('ts',0))[-1200:])
          events={k:compact_event(v) for k,v in events.items()}
          decisions=remote.get('decisions',[])+local.get('decisions',[])
          decisions=sorted(decisions,key=lambda x:x.get('ts',0))[-250:]
          forecasts={}
          for item in remote.get('forecasts',[])+local.get('forecasts',[]):
              forecasts[item.get('forecast_id',str(len(forecasts)))]=item
          forecasts=sorted(forecasts.values(),key=lambda x:x.get('created_ts',0))[-500:]
          merged={'events':events,'decisions':decisions,'forecasts':forecasts,'last_ai_ts':max(float(remote.get('last_ai_ts',0)),float(local.get('last_ai_ts',0)))}
          Path('riskwatch_state.json').write_text(json.dumps(merged,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          Path('riskwatch_latest.json').write_text(Path('/tmp/riskwatch_latest.local.json').read_text(encoding='utf-8'),encoding='utf-8')
          PY
            git add riskwatch_state.json riskwatch_latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore: update riskwatch state'
            if git push; then exit 0; fi
            git reset --hard HEAD~1
          done
          echo 'Failed to persist state after 3 attempts' >&2
          exit 1
      - name: Upload latest report
        uses: actions/upload-artifact@v4
        with:
          name: riskwatch-latest
          path: riskwatch_latest.json
# validated with OpenAI Responses API smoke test
