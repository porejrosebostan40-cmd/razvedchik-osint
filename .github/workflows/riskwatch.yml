name: RiskWatch
on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
concurrency:
  group: riskwatch-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip && pip install .
      - name: Run RiskWatch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISKWATCH_STATE: riskwatch_state.json
          MAX_RESULTS_PER_QUERY: '6'
        run: python -m riskwatch.cli > riskwatch_latest.json
      - name: Persist state
        run: |
          git config user.name 'riskwatch-bot'
          git config user.email 'riskwatch-bot@users.noreply.github.com'
          git add riskwatch_state.json riskwatch_latest.json
          git diff --cached --quiet || git commit -m 'chore: update riskwatch state'
          git push
      - name: Upload latest report
        uses: actions/upload-artifact@v4
        with:
          name: riskwatch-latest
          path: riskwatch_latest.json
