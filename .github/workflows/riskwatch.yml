name: RiskWatch
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
concurrency:
  group: riskwatch-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip && pip install .
      - name: Validate OpenAI secret presence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"
      - name: Run RiskWatch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISKWATCH_STATE: riskwatch_state.json
          RISKWATCH_DEBUG_HTML: /tmp/riskwatch_search_debug.html
          MAX_RESULTS_PER_QUERY: '6'
        run: python -m riskwatch.cli > riskwatch_latest.json
      - name: Persist state safely
        shell: bash
        run: |
          set -euo pipefail
          cp riskwatch_state.json /tmp/riskwatch_state.local.json
          cp riskwatch_latest.json /tmp/riskwatch_latest.local.json
          git config user.name 'riskwatch-bot'
          git config user.email 'riskwatch-bot@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          SEARCH_ENGINES=('duckduckgo.com','bing.com','google.com','yandex.ru','yandex.com')
          def valid_event(e):
              try:
                  d=urlparse(str(e.get('url',''))).netloc.lower().split(':')[0].removeprefix('www.')
              except Exception:
                  return False
              return bool(d) and d not in SEARCH_ENGINES and not any(d.endswith('.'+x) for x in SEARCH_ENGINES)
          def compact_event(e):
              if not valid_event(e): return None
              keep=('url','title','snippet','source','query','region','kind','ts','published_ts','published','date')
              out={k:e[k] for k in keep if k in e}
              if isinstance(out.get('snippet'),str): out['snippet']=out['snippet'][:700]
              if isinstance(out.get('title'),str): out['title']=out['title'][:500]
              return out
          def compact_pattern(p):
              if not isinstance(p,dict): return {}
              keep=('scenario_id','pattern_stage','pattern_stage_name','observed_stages','next_stage','next_event_horizon','independent_domains','source_families','regions_with_signals','negative_indicators','acceleration','structure_score','evidence_score','evidence_metrics','interpretation','evidence_chain','retrieval')
              return {k:p[k] for k in keep if k in p}
          def compact_decision(d):
              keep=('ts','scenario_question','scenario_answer','probability','model_probability','probability_calibration','risk','model_risk','confidence','analysis_provider','reason','signals','missing_indicators','next_event','horizon','pattern','calibration','evidence_chain','analytical_status','hallucination_guard')
              out={k:d[k] for k in keep if k in d}
              if 'pattern' in out: out['pattern']=compact_pattern(out['pattern'])
              if isinstance(out.get('signals'),list): out['signals']=out['signals'][:12]
              if isinstance(out.get('missing_indicators'),list): out['missing_indicators']=out['missing_indicators'][:12]
              return out
          def compact_forecast(f):
              keep=('forecast_id','scenario_id','created_ts','horizon','deadline_ts','target','predicted_stage','probability','raw_probability','issued_probability','structure_score','evidence_score','evidence_ids','evidence_fingerprint','resolved','outcome','resolved_ts','brier','issued_brier')
              return {k:f[k] for k in keep if k in f}
          remote=json.loads(Path('riskwatch_state.json').read_text(encoding='utf-8'))
          local=json.loads(Path('/tmp/riskwatch_state.local.json').read_text(encoding='utf-8'))
          events={**remote.get('events',{}), **local.get('events',{})}
          cleaned=[]
          for k,v in events.items():
              c=compact_event(v)
              if c is not None: cleaned.append((k,c))
          events=dict(sorted(cleaned,key=lambda kv:kv[1].get('ts',0))[-500:])
          decisions=remote.get('decisions',[])+local.get('decisions',[])
          decisions=sorted(decisions,key=lambda x:x.get('ts',0))[-80:]
          decisions=[compact_decision(x) for x in decisions]
          forecasts={}
          for item in remote.get('forecasts',[])+local.get('forecasts',[]):
              forecasts[item.get('forecast_id',str(len(forecasts)))]=item
          forecasts=sorted(forecasts.values(),key=lambda x:x.get('created_ts',0))[-200:]
          forecasts=[compact_forecast(x) for x in forecasts]
          cursor=max(int(remote.get('regional_cursor',0) or 0),int(local.get('regional_cursor',0) or 0))
          merged={'events':events,'decisions':decisions,'forecasts':forecasts,'last_ai_ts':max(float(remote.get('last_ai_ts',0)),float(local.get('last_ai_ts',0))),'regional_cursor':cursor}
          payload=json.dumps(merged,ensure_ascii=False,separators=(',',':'))
          if len(payload.encode('utf-8')) >= 90_000_000: raise SystemExit('Refusing to persist state above 90 MB')
          Path('riskwatch_state.json').write_text(payload,encoding='utf-8')
          Path('riskwatch_latest.json').write_text(Path('/tmp/riskwatch_latest.local.json').read_text(encoding='utf-8'),encoding='utf-8')
          PY
            git add riskwatch_state.json riskwatch_latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore: update riskwatch state'
            if git push; then exit 0; fi
            git reset --hard HEAD~1
          done
          echo 'Failed to persist state after 3 attempts' >&2
          exit 1
      - name: Upload latest report
        uses: actions/upload-artifact@v4
        with:
          name: riskwatch-latest
          path: riskwatch_latest.json
      - name: Upload raw search debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riskwatch-search-debug
          path: /tmp/riskwatch_search_debug.html
          if-no-files-found: ignore
