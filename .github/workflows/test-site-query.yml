name: Test site query (isolated)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: pip install -e .

      - name: Run isolated test
        run: python scripts/test_site_query.py

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-site-query-result
          path: |
            /tmp/test_site_query_result.json
            /tmp/test_site_query_DuckDuckGo.html
            /tmp/test_site_query_Bing.html
          if-no-files-found: ignore
