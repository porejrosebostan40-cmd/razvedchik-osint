name: Exa event gate final test

on:
  push:
    branches:
      - "test/exa-vs-search"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pip && pip install .
      - name: Run Exa event gate comparison
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: python3 scripts/exa_event_gate_test.py
