name: OpenAI Smoke Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify OpenAI Responses API and model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          python - <<'PY'
          import json, os, urllib.request
          payload={"model":"gpt-5.6-luna","input":"Return only JSON: {\"ok\":true}","text":{"format":{"type":"json_object"}},"store":False}
          req=urllib.request.Request("https://api.openai.com/v1/responses",data=json.dumps(payload).encode(),headers={"Authorization":"Bearer "+os.environ["OPENAI_API_KEY"],"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req, timeout=90) as resp: data=json.load(resp)
          print("OpenAI Responses API: OK", data.get("id",""))
          PY
