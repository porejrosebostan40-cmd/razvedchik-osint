[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "razvedchik-osint"
version = "0.2.0"
description = "Autonomous open-source intelligence research agent"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "beautifulsoup4>=4.12,<5"]

[project.scripts]
razvedchik = "razvedchik.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
